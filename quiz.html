<style>
  :root {
    --cream: #EDE6D3; --cream-2: #F6F1E5; --cream-dark: #DBC8AA;
    --ink: #1B1F24; --ink-soft: #4A4740;
    --teal: #436074; --teal-deep: #2E4453; --orange: #D08F4A; --terracotta: #A54E2A;
    --green: #3F7A4E; --red: #B03A2E;
    --border: rgba(27,31,36,0.14); --radius: 14px;
    --serif: Georgia, 'Times New Roman', ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--cream); line-height: 1.6; }
  img { max-width: 100%; display: block; height: auto; }
  a { color: inherit; }
  section { padding: 3rem 1.5rem; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h2 { font-family: var(--serif); line-height: 1.15; margin: 0 0 0.6em; font-size: clamp(1.5rem, 3.2vw, 2.1rem); }
  .eyebrow { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terracotta); font-weight: 700; margin-bottom: 0.8em; display: block; }
  .btn { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.6em 1.2em; border-radius: 999px; font-weight: 700; text-decoration: none; border: 2px solid var(--ink); font-size: 0.92rem; color: var(--ink); background: transparent; cursor: pointer; }
  .btn:hover { background: var(--ink); color: var(--cream); }

  header { position: sticky; top: 0; z-index: 20; background: rgba(237,230,211,0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .nav { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1.5rem; }
  .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
  .brand img { width: 40px; height: 40px; border-radius: 50%; }
  .brand span { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; }

  .breadcrumb { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 0.6rem; }
  .breadcrumb a { text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { color: var(--terracotta); }

  .progress-bar { position: sticky; top: 57px; z-index: 15; background: var(--cream-dark); height: 6px; }
  .progress-fill { height: 100%; background: var(--terracotta); width: 0%; transition: width 0.2s ease; }
  .progress-label { font-size: 0.85rem; color: var(--ink-soft); }

  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
  .chip { border: 1.5px solid var(--border); background: var(--cream-2); color: var(--ink); border-radius: 999px; padding: 0.3em 0.9em; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: var(--sans); }
  .chip.active { background: var(--teal-deep); color: var(--cream-2); border-color: var(--teal-deep); }

  .q-card { background: var(--cream-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.2rem; }
  .q-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: var(--teal); color: var(--cream-2); padding: 0.25em 0.7em; border-radius: 999px; margin-bottom: 0.7rem; }
  .q-num { color: var(--ink-soft); font-weight: 700; margin-right: 0.35em; }
  .q-text { font-size: 1.08rem; margin-bottom: 1rem; }
  .q-fig { margin: 0 0 1rem; display: flex; justify-content: center; }
  .q-fig svg { max-width: 100%; height: auto; max-height: 220px; }
  .q-options { display: grid; gap: 0.6rem; }
  .q-option { display: block; width: 100%; text-align: left; padding: 0.7em 1em; border-radius: 10px; border: 1.5px solid var(--border); background: var(--cream); font-family: var(--sans); font-size: 1rem; color: var(--ink); cursor: pointer; overflow-x: auto; }
  .q-option:hover:not(:disabled) { border-color: var(--teal); }
  .q-option:disabled { cursor: default; color: var(--ink); }
  .q-option.correct { background: rgba(63,122,78,0.15); border-color: var(--green); font-weight: 700; }
  .q-option.wrong { background: rgba(176,58,46,0.12); border-color: var(--red); }
  .q-explain { margin-top: 1rem; padding: 0.9em 1.1em; background: var(--cream); border-left: 3px solid var(--teal); border-radius: 8px; font-size: 0.97rem; display: none; line-height: 1.9; overflow-x: auto; }
  .q-explain.show { display: block; }
  .q-explain .lbl { font-weight: 700; color: var(--teal-deep); display: block; margin-bottom: 0.2em; }

  /* πλήρης μαθηματική γραφή: ποτέ σπάσιμο μέσα σε έκφραση */
  .katex { white-space: nowrap; font-size: 1.08em; }
  .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }

  .ai-row { margin-top: 0.8rem; }
  .ai-ask-btn { display: inline-flex; align-items: center; gap: 0.5em; background: var(--teal-deep); color: var(--cream-2); border: none; border-radius: 999px; padding: 0.55em 1.1em; font-size: 0.88rem; font-weight: 700; cursor: pointer; }
  .ai-ask-btn:hover { background: var(--teal); }
  .ai-ask-btn:disabled { opacity: 0.6; cursor: default; }
  .ai-explain { margin-top: 0.8rem; padding: 0.9em 1.1em; background: rgba(67,96,116,0.08); border-left: 3px solid var(--teal-deep); border-radius: 8px; font-size: 0.94rem; display: none; }
  .ai-explain.show { display: block; }
  .ai-explain .ai-label { font-weight: 700; color: var(--teal-deep); display: block; margin-bottom: 0.3em; }

  .done { text-align: center; padding: 2rem 1rem; display: none; }
  .done.show { display: block; }
  footer { text-align: center; padding: 2.4rem 1.5rem; font-size: 0.85rem; color: var(--ink-soft); }
</style>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

// Βάλε εδώ το URL του Cloudflare Worker μετά το deploy (δες cloudflare-worker/README.md).
const EXPLAIN_ENDPOINT = '';

const MATH = { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false, strict: false };
const render = el => renderMathInElement(el, MATH);

/* ---------- Σχήματα (SVG) ---------- */
const INK = '#1B1F24', TEAL = '#436074', FILL = 'rgba(67,96,116,0.12)';
const svg = (w, h, inner) =>
  `<svg viewBox="0 0 ${w} ${h}" width="${w}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif" font-size="15" fill="${INK}">${inner}</svg>`;
const T = (x, y, s, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-style="italic">${s}</text>`;
const poly = pts => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${FILL}" stroke="${TEAL}" stroke-width="2" stroke-linejoin="round"/>`;
const line = (a, b, extra = '') => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${TEAL}" stroke-width="2" ${extra}/>`;
const dot = (p, label, dx = 0, dy = -8) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${INK}"/>${T(p[0] + dx, p[1] + dy, label)}`;
const sq = (p, s, dirx, diry) => `<polyline points="${p[0] + dirx * s},${p[1]} ${p[0] + dirx * s},${p[1] + diry * s} ${p[0]},${p[1] + diry * s}" fill="none" stroke="${INK}" stroke-width="1.3"/>`;

const FIG = {
  raw: f => f.svg,
  rect: f => svg(300, 150, `${poly([[40, 30], [220, 30], [220, 110], [40, 110]])}${T(130, 22, f.labels[0])}${T(232, 75, f.labels[1], 'start')}`),
  isosceles: f => svg(260, 160, `${poly([[130, 20], [30, 130], [230, 130]])}${T(130, 150, f.base)}${T(66, 70, f.side, 'end')}${T(194, 70, f.side, 'start')}`),
  right: f => {
    const L = f.labels || {};
    return svg(260, 170, `${poly([[40, 130], [210, 130], [40, 30]])}${sq([40, 130], 14, 1, -1)}${T(125, 150, L.a || '')}${T(34, 85, L.b || '', 'end')}${T(136, 70, L.c || '', 'start')}${f.angle ? T(190, 122, f.angle, 'end') : ''}${f.v ? T(30, 142, 'Α', 'end') + T(40, 22, 'Β') + T(222, 142, 'Γ', 'start') : ''}`);
  },
  circle: f => svg(220, 200, `<circle cx="110" cy="100" r="75" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/>${dot([110, 100], 'O', 0, 18)}${line([110, 100], [185, 100])}${T(150, 92, f.r || 'R')}`),
  isoH: f => svg(260, 170, `${poly([[130, 20], [30, 140], [230, 140]])}${line([130, 20], [130, 140], 'stroke-dasharray="5 4"')}${sq([130, 140], 12, 1, -1)}${T(130, 160, f.base)}${T(66, 76, f.side, 'end')}${T(194, 76, f.side, 'start')}${T(122, 86, f.h || 'h', 'end')}`),
  equi: f => svg(260, 170, `${poly([[130, 20], [40, 140], [220, 140]])}${line([130, 20], [130, 140], 'stroke-dasharray="5 4"')}${sq([130, 140], 12, 1, -1)}${T(130, 160, f.side)}${T(72, 76, f.side, 'end')}${T(122, 86, f.h || 'h', 'end')}`),
  numline: f => {
    const x0 = 20, x1 = 300, sc = (x1 - x0) / (f.max - f.min), X = v => x0 + (v - f.min) * sc;
    let t = '';
    for (let k = Math.ceil(f.min); k <= Math.floor(f.max); k++) t += `<line x1="${X(k)}" y1="62" x2="${X(k)}" y2="72" stroke="${INK}"/>${T(X(k), 90, String(k))}`;
    f.points.forEach(p => { t += `<circle cx="${X(p.v)}" cy="67" r="4.5" fill="${TEAL}"/>${T(X(p.v), 48, p.l)}`; });
    return svg(320, 100, `<line x1="${x0 - 8}" y1="67" x2="${x1 + 8}" y2="67" stroke="${INK}" stroke-width="1.5"/>${t}`);
  },
  theodorus: f => {
    const O = [0, 0], sc = 60, pts = [O];
    let prev = [sc, 0], dir = [1, 0], out = line(O, prev);
    pts.push(prev);
    for (let i = 1; i <= f.n; i++) {
      const perp = [dir[1], -dir[0]];
      const nq = [prev[0] + perp[0] * sc, prev[1] + perp[1] * sc];
      out += line(prev, nq) + line(O, nq);
      pts.push(nq);
      if ((f.labels || []).includes(i)) {
        const m = [(O[0] + nq[0]) / 2, (O[1] + nq[1]) / 2], n = [nq[0] - O[0], nq[1] - O[1]], L = Math.hypot(n[0], n[1]);
        out += T(m[0] - n[1] / L * 14, m[1] + n[0] / L * 14 + 5, '√' + (i + 1));
      }
      const d = [nq[0] - O[0], nq[1] - O[1]], L = Math.hypot(d[0], d[1]);
      dir = [d[0] / L, d[1] / L]; prev = nq;
    }
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = 34;
    const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad, w = Math.max(...xs) - x0 + pad, h = Math.max(...ys) - y0 + pad;
    return `<svg viewBox="${x0} ${y0} ${w} ${h}" width="${Math.min(w, 330)}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif" font-size="15" fill="${INK}">${out}${dot(O, 'Ο', -8, 18)}</svg>`;
  },
  squareM: f => svg(260, 170, `${poly([[50, 140], [200, 140], [200, 20], [50, 20]])}${line([50, 140], [200, 80], `stroke-dasharray="5 4"`)}${line([50, 20], [200, 80], `stroke-dasharray="5 4"`)}${dot([200, 80], 'Μ', 14, 5)}${T(40, 154, 'Α', 'end')}${T(210, 154, 'Β', 'start')}${T(210, 18, 'Γ', 'start')}${T(40, 18, 'Δ', 'end')}${T(125, 160, f.side || '4')}`),
  grid: f => {
    let g = '';
    for (let i = 0; i <= 7; i++) g += `<line x1="${30 + i * 30}" y1="20" x2="${30 + i * 30}" y2="140" stroke="rgba(67,96,116,0.25)"/>`;
    for (let j = 0; j <= 4; j++) g += `<line x1="30" y1="${20 + j * 30}" x2="240" y2="${20 + j * 30}" stroke="rgba(67,96,116,0.25)"/>`;
    const A = [60, 110], B = [210, 20];
    return svg(270, 160, `${g}${line(A, B)}${line(A, [210, 110], 'stroke-dasharray="4 3"')}${line([210, 110], B, 'stroke-dasharray="4 3"')}${dot(A, 'Α', -10, 14)}${dot(B, 'Β', 10, -4)}`);
  },
  box: f => svg(300, 190, `${poly([[40, 70], [200, 70], [200, 160], [40, 160]])}${poly([[40, 70], [90, 30], [250, 30], [200, 70]])}${poly([[200, 70], [250, 30], [250, 120], [200, 160]])}${line([40, 160], [250, 30], 'stroke-dasharray="5 4"')}${T(120, 180, f.a)}${T(232, 152, f.b, 'start')}${T(26, 118, f.c, 'end')}`),
  plot: f => {
    const [x0, x1] = f.xr, [y0, y1] = f.yr, cell = f.cell || 26, pad = 22;
    const W = (x1 - x0) * cell + 2 * pad, H = (y1 - y0) * cell + 2 * pad;
    const X = x => pad + (x - x0) * cell, Y = y => pad + (y1 - y) * cell;
    const COL = ['#436074', '#A54E2A', '#3F7A4E', '#8A6D1F'];
    let g = '';
    for (let x = Math.ceil(x0); x <= x1; x++) g += `<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" stroke="rgba(67,96,116,0.18)"/>`;
    for (let y = Math.ceil(y0); y <= y1; y++) g += `<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" stroke="rgba(67,96,116,0.18)"/>`;
    g += `<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="${INK}" stroke-width="1.4"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="${INK}" stroke-width="1.4"/>`;
    g += `<text x="${X(x1) + 2}" y="${Y(0) + 14}" font-size="13" font-style="italic" text-anchor="end">x</text><text x="${X(0) + 6}" y="${Y(y1) + 4}" font-size="13" font-style="italic">y</text>`;
    const st = f.step || 1;
    for (let x = Math.ceil(x0); x <= x1; x++) if (x && x % st === 0) g += `<text x="${X(x)}" y="${Y(0) + 14}" font-size="11" text-anchor="middle">${x}</text>`;
    for (let y = Math.ceil(y0); y <= y1; y++) if (y && y % st === 0) g += `<text x="${X(0) - 5}" y="${Y(y) + 4}" font-size="11" text-anchor="end">${y}</text>`;
    const curve = (fn, xa, xb, col, label) => {
      let seg = [], segs = [];
      for (let i = 0; i <= 240; i++) {
        const x = xa + (xb - xa) * i / 240, y = fn(x);
        if (isFinite(y) && y >= y0 && y <= y1) seg.push([X(x), Y(y)]); else { if (seg.length) segs.push(seg); seg = []; }
      }
      if (seg.length) segs.push(seg);
      let out = segs.map(s => `<polyline points="${s.map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2"/>`).join('');
      if (label && segs.length) { const last = segs[segs.length - 1], p = last[Math.max(0, last.length - 12)]; out += `<text x="${p[0] - 4}" y="${p[1] - 7}" font-size="13" font-style="italic" fill="${col}" text-anchor="end">${label}</text>`; }
      return out;
    };
    (f.polys || []).forEach(p => { g += `<polygon points="${p.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="rgba(208,143,74,0.22)" stroke="${TEAL}" stroke-width="2"/>`; });
    (f.lines || []).forEach((l, i) => {
      const col = COL[i % COL.length];
      if (l.v !== undefined) g += `<line x1="${X(l.v)}" y1="${Y(y0)}" x2="${X(l.v)}" y2="${Y(y1)}" stroke="${col}" stroke-width="2.2"/>`;
      else g += curve(x => l.m * x + (l.b || 0), x0, x1, col, l.l);
    });
    (f.hyp || []).forEach((h, i) => {
      const col = COL[(i + (f.lines || []).length) % COL.length];
      g += curve(x => h.a / x, x0, -0.001, col, h.l) + curve(x => h.a / x, 0.001, x1, col);
    });
    (f.pts || []).forEach(p => { g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.6" fill="${INK}"/>` + (p.l ? `<text x="${X(p.x) + (p.dx ?? 7)}" y="${Y(p.y) + (p.dy ?? -7)}" font-size="13" font-style="italic">${p.l}</text>` : ''); });
    return `<svg viewBox="0 0 ${W} ${H}" width="${Math.min(W, 340)}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif" fill="${INK}">${g}</svg>`;
  },
  para: f => svg(280, 150, `${poly([[50, 120], [190, 120], [240, 30], [100, 30]])}${line([100, 30], [100, 120], 'stroke-dasharray="5 4"')}${sq([100, 120], 11, 1, -1)}${T(120, 142, f.b)}${T(92, 80, f.h, 'end')}${f.s ? T(236, 84, f.s, 'start') : ''}`),
  tri: f => svg(280, 150, `${poly([[40, 120], [250, 120], [130, 25]])}${line([130, 25], [130, 120], 'stroke-dasharray="5 4"')}${sq([130, 120], 11, 1, -1)}${T(160, 142, f.b)}${T(122, 80, f.h, 'end')}`),
  trap: f => svg(280, 150, `${poly([[30, 120], [250, 120], [200, 30], [80, 30]])}${line([80, 30], [80, 120], 'stroke-dasharray="5 4"')}${sq([80, 120], 11, 1, -1)}${T(140, 22, f.top)}${T(150, 142, f.bottom)}${T(72, 80, f.h, 'end')}`),
  rtrap: f => svg(280, 150, `${poly([[40, 120], [240, 120], [150, 35], [40, 35]])}${sq([40, 120], 11, 1, -1)}${T(95, 27, f.top)}${T(140, 142, f.bottom)}${T(30, 80, f.h || '', 'end')}${T(210, 70, f.side || '', 'start')}`),
  rhomb: f => svg(280, 160, `${poly([[140, 20], [250, 80], [140, 140], [30, 80]])}${line([30, 80], [250, 80], 'stroke-dasharray="5 4"')}${line([140, 20], [140, 140], 'stroke-dasharray="5 4"')}${T(90, 72, f.d1 || '')}${T(150, 52, f.d2 || '', 'start')}${f.side ? T(215, 44, f.side, 'start') : ''}`),
  sqcomp: f => svg(280, 180, `${poly([[40, 30], [160, 30], [160, 150], [40, 150]])}${poly([[160, 30], [160, 150], [240, 150]])}${T(100, 170, '6')}${T(30, 95, '6', 'end')}${T(200, 170, '4')}`),
  squareE: f => svg(260, 170, `${poly([[60, 140], [200, 140], [200, 20], [60, 20]])}${line([60, 20], [130, 140], 'stroke-dasharray="5 4"')}${line([200, 20], [130, 140], 'stroke-dasharray="5 4"')}${dot([130, 140], 'Ε', 0, 16)}${T(50, 154, 'Α', 'end')}${T(210, 154, 'Β', 'start')}${T(210, 18, 'Γ', 'start')}${T(50, 18, 'Δ', 'end')}${T(30, 85, f.side || '4', 'end')}`),
  rectE: f => svg(280, 160, `${poly([[40, 130], [240, 130], [240, 40], [40, 40]])}${line([40, 130], [110, 40], 'stroke-dasharray="5 4"')}${line([240, 130], [110, 40], 'stroke-dasharray="5 4"')}${dot([110, 40], 'Ε', 0, -8)}${T(30, 144, 'Α', 'end')}${T(250, 144, 'Β', 'start')}${T(250, 36, 'Γ', 'start')}${T(30, 36, 'Δ', 'end')}${T(140, 150, '10')}${T(258, 90, '6', 'start')}`),
  cube: f => svg(240, 200, `${poly([[30, 80], [140, 80], [140, 180], [30, 180]])}${poly([[30, 80], [80, 35], [190, 35], [140, 80]])}${poly([[140, 80], [190, 35], [190, 135], [140, 180]])}${line([30, 180], [190, 35], 'stroke-dasharray="5 4"')}${T(85, 198, f.a)}`),
  nested: f => svg(260, 200, `${poly([[40, 170], [220, 170], [220, 20], [40, 20]])}<polygon points="130,170 220,95 130,20 40,95" fill="rgba(208,143,74,0.12)" stroke="${TEAL}" stroke-width="2"/><polygon points="130,57 167,95 130,132 93,95" fill="rgba(67,96,116,0.2)" stroke="${TEAL}" stroke-width="1.6"/>${T(130, 188, f.a)}`),
  sqdiag: f => svg(240, 180, `${poly([[50, 150], [190, 150], [190, 20], [50, 20]])}${line([50, 150], [190, 20], 'stroke-dasharray="5 4"')}${T(120, 168, f.a || '')}${T(130, 78, f.d || '', 'start')}`),
  rectdiag: f => svg(330, 150, `${poly([[40, 120], [240, 120], [240, 30], [40, 30]])}${line([40, 120], [240, 30], 'stroke-dasharray="5 4"')}${T(140, 140, f.a || '')}${T(252, 80, f.b || '', 'start')}${T(120, 66, f.d || '', 'end')}`),
  inscr: f => svg(260, 190, `<circle cx="130" cy="100" r="70" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/>${poly([[142, 31], [73, 140], [187, 140]]).replace(FILL, 'none')}${line([130, 100], [73, 140], 'stroke-dasharray="5 4"')}${line([130, 100], [187, 140], 'stroke-dasharray="5 4"')}${dot([130, 100], 'Ο', -4, -8)}${T(142, 24, 'Α')}${T(62, 150, 'Β', 'end')}${T(196, 150, 'Γ', 'start')}${T(142, 58, f.phi || '', 'middle')}${T(130, 128, f.omega || '', 'middle')}`),
  thales: f => svg(260, 190, `<circle cx="130" cy="100" r="70" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/>${line([60, 100], [200, 100])}${line([60, 100], [160, 37])}${line([160, 37], [200, 100])}${dot([130, 100], 'Ο', 0, 16)}${T(52, 106, 'Α', 'end')}${T(208, 106, 'Β', 'start')}${T(162, 30, 'Γ', 'start')}${f.angle ? T(98, 94, f.angle) : ''}`),
  hexagon: f => svg(260, 190, `<circle cx="130" cy="100" r="70" fill="none" stroke="${TEAL}" stroke-width="2"/>${poly([[200, 100], [165, 160.6], [95, 160.6], [60, 100], [95, 39.4], [165, 39.4]])}${dot([130, 100], 'Ο', 0, 16)}${f.r ? T(165, 94, f.r) : ''}`),
  concentric: f => svg(260, 190, `<circle cx="130" cy="100" r="70" fill="rgba(208,143,74,0.2)" stroke="${TEAL}" stroke-width="2"/><circle cx="130" cy="100" r="${f.inner || 40}" fill="#F6F1E5" stroke="${TEAL}" stroke-width="2"/>${dot([130, 100], 'Θ', 0, 16)}${f.R ? line([130, 100], [200, 100]) + T(168, 94, f.R) : ''}${f.r ? line([130, 100], [130 + (f.inner || 40), 100]) : ''}`),
  twocirc: f => svg(270, 140, `${poly([[20, 20], [244, 20], [244, 132], [20, 132]]).replace(FILL, 'rgba(208,143,74,0.2)')}<circle cx="76" cy="76" r="56" fill="#F6F1E5" stroke="${TEAL}" stroke-width="2"/><circle cx="188" cy="76" r="56" fill="#F6F1E5" stroke="${TEAL}" stroke-width="2"/>${dot([76, 76], 'Κ', 0, 16)}${dot([188, 76], 'Λ', 0, 16)}${T(132, 12, '8')}${T(256, 80, '4', 'start')}`),
  threecirc: f => svg(260, 200, `<circle cx="70" cy="140" r="40" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/><circle cx="150" cy="140" r="40" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/><circle cx="110" cy="70.7" r="40" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/>${poly([[70, 140], [150, 140], [110, 70.7]]).replace(FILL, 'rgba(208,143,74,0.3)')}${T(60, 144, 'Κ', 'end')}${T(160, 144, 'Λ', 'start')}${T(110, 24, 'Μ')}`),
  quarter: f => svg(260, 200, `${poly([[40, 20], [190, 20], [190, 170], [40, 170]]).replace(FILL, 'rgba(208,143,74,0.25)')}<path d="M40,170 L190,170 A150,150 0 0 0 40,20 Z" fill="${FILL}" stroke="${TEAL}" stroke-width="2"/>${T(115, 190, f.a || '')}${T(30, 175, 'Κ', 'end')}`),
  annulus: f => FIG.concentric({ inner: 10, R: f.R }),
  pie: f => {
    const n = f.n, k = f.k, cx = 100, cy = 90, r = 70;
    let g = '';
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + 2 * Math.PI * i / n, a1 = -Math.PI / 2 + 2 * Math.PI * (i + 1) / n;
      const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)].map(v => v.toFixed(1));
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      g += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${i < k ? 'rgba(208,143,74,0.55)' : '#F6F1E5'}" stroke="${TEAL}" stroke-width="1.6"/>`;
    }
    return svg(200, 180, g);
  },
  bar: f => {
    const w = Math.min(28, 260 / f.n), x0 = 20;
    let g = '';
    for (let i = 0; i < f.n; i++) g += `<rect x="${x0 + i * w}" y="20" width="${w}" height="34" fill="${i < f.k ? 'rgba(67,96,116,0.45)' : '#F6F1E5'}" stroke="${TEAL}" stroke-width="1.6"/>`;
    return svg(300, 74, g);
  },
  balance: f => svg(300, 170, `${line([40, 50], [260, 50])}${line([150, 50], [150, 140])}${line([100, 140], [200, 140])}${line([40, 50], [40, 78])}${line([260, 50], [260, 78])}${poly([[10, 78], [70, 78], [62, 100], [18, 100]])}${poly([[230, 78], [290, 78], [282, 100], [238, 100]])}${T(6, 124, f.left, 'start')}${T(294, 124, f.right, 'end')}<circle cx="150" cy="50" r="4" fill="${INK}"/>`),
  parallels: f => svg(300, 170, `${line([20, 50], [280, 50])}${line([20, 120], [280, 120])}${line([110, 150], [190, 20])}${f.angle ? T(196, 68, f.angle, 'start') : ''}${T(290, 46, 'ε₁', 'end')}${T(290, 116, 'ε₂', 'end')}`),
  twolines: f => svg(300, 190, `${line([20, 40], [280, 40])}${line([20, 150], [280, 150])}${dot([240, 95], 'Ε', 8, 5)}${line([40, 40], [240, 95])}${line([40, 150], [240, 95])}${T(30, 36, 'Α', 'end')}${T(30, 166, 'Γ', 'end')}${T(290, 36, 'ε₁', 'end')}${T(290, 166, 'ε₂', 'end')}${T(120, 56, '30°')}${T(120, 142, '45°')}`),
};
const drawFig = f => (f && FIG[f.type] ? FIG[f.type](f) : '');

/* ---------- Βοηθός AI ---------- */
async function askAi(btn, aiBox, payload) {
  aiBox.classList.add('show');
  if (!EXPLAIN_ENDPOINT) {
    aiBox.innerHTML = '<span class="ai-label">Βοηθός AI</span>Η υπηρεσία δεν είναι ακόμα συνδεδεμένη.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Σκέφτεται…';
  aiBox.innerHTML = '<span class="ai-label">Βοηθός AI</span>Μια στιγμή…';
  try {
    const res = await fetch(EXPLAIN_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    const msg = (!res.ok || data.error) ? (data.error || 'Κάτι πήγε στραβά, δοκίμασε ξανά.') : data.explanation;
    aiBox.innerHTML = '<span class="ai-label">Βοηθός AI</span>';
    aiBox.appendChild(document.createTextNode(msg));
    render(aiBox);
  } catch {
    aiBox.innerHTML = '<span class="ai-label">Βοηθός AI</span>Δεν μπόρεσα να συνδεθώ. Δοκίμασε ξανά σε λίγο.';
  } finally {
    btn.disabled = false; btn.textContent = '🤖 Ρώτα ξανά τον βοηθό AI';
  }
}

/* ---------- Φόρτωση κεφαλαίου ---------- */
const params = new URLSearchParams(location.search);
const meta = (window.CHAPTER_LIST || []).flatMap(g => g.chapters.map(c => ({ ...c, grade: g.grade }))).find(c => c.id === params.get('ch'));

if (!meta) {
  document.getElementById('title').textContent = 'Το κεφάλαιο δεν βρέθηκε';
  document.getElementById('crumb').innerHTML = '<a href="askiseis.html">Αποθετήριο ασκήσεων</a>';
} else {
  const s = document.createElement('script');
  s.src = 'data/' + meta.id + '.js';
  s.onload = () => start(meta, window.QUIZ);
  s.onerror = () => { document.getElementById('title').textContent = 'Σφάλμα φόρτωσης ασκήσεων'; };
  document.head.appendChild(s);
}

function shuffled(arr) {
  const a = arr.map((v, i) => ({ v, i }));
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start(meta, quiz) {
  document.title = meta.title + ' | MathDecoded';
  document.getElementById('crumb').innerHTML =
    `<a href="index.html">MathDecoded</a> › <a href="askiseis.html">Αποθετήριο ασκήσεων</a> › ${meta.grade} › ${meta.title}`;
  document.getElementById('eyebrow').textContent = 'Αποθετήριο ασκήσεων · ' + meta.grade;
  document.getElementById('title').textContent = meta.title;

  const items = quiz.items;
  const root = document.getElementById('quizRoot');
  const cards = [];
  let answered = 0, right = 0;

  const label = document.getElementById('progressLabel');
  const update = () => {
    document.getElementById('progressFill').style.width = Math.round(answered / items.length * 100) + '%';
    const mc = items.filter(it => it.options).length;
    label.textContent = `${answered} / ${items.length} ολοκληρωμένες` + (mc ? ` · ${right} σωστές στις πολλαπλής (από ${mc})` : '');
    if (answered === items.length) {
      document.getElementById('doneText').textContent = mc ? `Σωστές απαντήσεις πολλαπλής επιλογής: ${right} από ${mc}.` : 'Ολοκλήρωσες όλες τις ασκήσεις.';
      document.getElementById('done').classList.add('show');
    }
  };

  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.tag = item.tag;

    const tag = document.createElement('span');
    tag.className = 'q-tag'; tag.textContent = item.tag;
    card.appendChild(tag);

    const q = document.createElement('div');
    q.className = 'q-text';
    q.innerHTML = `<span class="q-num">${i + 1}.</span>${item.q}`;
    card.appendChild(q);

    if (item.fig) {
      const f = document.createElement('div');
      f.className = 'q-fig'; f.innerHTML = drawFig(item.fig);
      card.appendChild(f);
    }

    const opts = document.createElement('div');
    opts.className = 'q-options';
    const explain = document.createElement('div');
    explain.className = 'q-explain';
    explain.innerHTML = `<span class="lbl">Λύση</span>${item.explain}`;

    const aiRow = document.createElement('div');
    aiRow.className = 'ai-row'; aiRow.style.display = 'none';
    const aiBtn = document.createElement('button');
    aiBtn.type = 'button'; aiBtn.className = 'ai-ask-btn';
    aiBtn.textContent = '🤖 Ρώτα τον βοηθό AI γιατί έκανα λάθος';
    const aiBox = document.createElement('div');
    aiBox.className = 'ai-explain';
    aiRow.append(aiBtn, aiBox);

    if (!item.options) {
      const show = document.createElement('button');
      show.type = 'button'; show.className = 'ai-ask-btn'; show.textContent = 'Δες τη λύση';
      show.addEventListener('click', () => {
        if (!explain.classList.contains('show')) { answered++; update(); }
        explain.classList.add('show'); show.style.display = 'none';
      });
      card.append(show, explain);
      root.appendChild(card);
      cards.push(card);
      return;
    }
    let locked = false;
    shuffled(item.options).forEach(({ v, i: orig }) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'q-option'; b.innerHTML = v;
      b.dataset.orig = orig;
      b.addEventListener('click', () => {
        if (locked) return;
        locked = true; answered++;
        [...opts.children].forEach(el => {
          el.disabled = true;
          if (+el.dataset.orig === item.correct) el.classList.add('correct');
        });
        if (orig === item.correct) right++;
        else {
          b.classList.add('wrong');
          aiRow.style.display = 'block';
          aiBtn.addEventListener('click', () => askAi(aiBtn, aiBox, {
            question: item.q, options: item.options,
            correctAnswer: item.options[item.correct], studentAnswer: v, explain: item.explain,
          }));
        }
        explain.classList.add('show');
        update();
      });
      opts.appendChild(b);
    });

    card.append(opts, explain, aiRow);
    root.appendChild(card);
    cards.push(card);
  });

  render(root);
  update();

  // φίλτρα ανά ομάδα/είδος
  const tags = [...new Set(items.map(i => i.tag))];
  const groups = [...new Set(tags.map(t => t.split(' · ')[0]))];
  if (groups.length > 1) {
    const box = document.getElementById('filters');
    const mk = (text, g) => {
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'chip' + (g === null ? ' active' : ''); c.textContent = text;
      c.addEventListener('click', () => {
        [...box.children].forEach(x => x.classList.toggle('active', x === c));
        cards.forEach(cd => { cd.style.display = (!g || cd.dataset.tag.split(' · ')[0] === g) ? '' : 'none'; });
      });
      box.appendChild(c);
    };
    mk('Όλες', null);
    groups.forEach(g => mk(g, g));
  }
}
